project:
  name: my-project
  project_root_path: /path/to/projects/my-project # project root path
  creation_mode: auto # auto — pipeline runs end-to-end. manual — each AI product waits for user confirmation.
  language: zh-CN  # Narration language: zh-CN | en-US.
  video_style: documentary # xxx | documentary | knowledge_sharing | news_broadcast | product_intro | data_report | tutorial
  target_audience: xxx
video:
  orientation: horizontal # horizontal (16:9) | vertical (9:16).
  resolution: 1080p # 1080p (1920x1080 horizontal, 1080x1920 vertical) | 4k (3840x2160 / 2160x3840).
  fps: 24
aigc:
  # Origin (pre-upscale) generation dimensions. AIGC assets are generated at
  # these sizes, then upscaled to the target video resolution if needed.
  origin_image_width: 1280
  origin_image_height: 720
  origin_video_width: 960
  origin_video_height: 540
  seed: 0 # 全局随机种子
stock_media:
  # search_image: enable stock search for image scenes. Default true.
  # search_video: enable stock search for video scenes. Default false.
  search_image: true
  search_video: false
  # Sources: provider + api_key. Default: empty — stock search disabled.
  # Example:
  #   sources:
  #     - provider: pexels
  #       api_key: "your-pexels-api-key"
  #     - provider: pixabay
  #       api_key: "your-pixabay-api-key"
  #     - provider: unsplash    # photos only
  #       api_key: "your-unsplash-access-key"
  sources: []
tts:
  # ── Backend selection ──────────────────────────────────────────────────
  #   comfyui_indextts — ComfyUI index_tts_2 workflow (default).
  #   http_server      — HTTP multipart TTS server (see tts.http below).
  #
  # Both `tts synth` and `tts run` auto-read this field — no --backend flag
  # needed in commands. Set once, all TTS calls route automatically.
  backend: comfyui_indextts
  # speed: 旁白语速倍率。每段合成旁白都用 ffmpeg atempo 变速，保证全片语速
  #   一致：speed×基准速率，1.0 = 每秒 5 个汉字（中文）或约 2.5 个单词（英文）。
  #   音色设计参考音频不调整语速。
  speed: 1.0
  volume: 1.0 # narration volume 0–1 (Remotion <Audio> volume multiplier)
  pause_seconds: 0.5 # 每段旁白音频后的留白秒数（计入 narration.total_frame，读完停顿再读下一段）
  loudnorm: true # 对每段旁白音频做响度归一（目标 LUFS），让旁白更清晰可闻（会重编码 WAV）
  loudness_target: -14 # 响度目标（LUFS，负数）：越大（越接近0）越响，如 -16 沉稳 / -14 标准 / -12 更响
    # ── Reference voice ─────────────────────────────────────────────────────
    # voice_file: can be empty at Step 1. If empty when running TTS (Step 7),
    #   the voice design workflow (qwen3_tts_voice_design) runs automatically
    #   using voice_instruct, generates projects/{name}/voice_file.wav, and
    #   updates this field.
    # voice_instruct: REQUIRED — agent fills (example shown). Describes the
    #   target voice characteristics. 建议带"语速快"：每段合成旁白会被变速到
    #   统一语速标准（5 字/秒 @ speed=1.0），参考音色原生语速越快，变速量越
    #   小、失真越小。
    #   zh-CN example: "男，中年，中音调，语速快"  en-US example: "male, middle-aged, moderate pitch, fast pace"
    #   See comfyui-scheduler/doc/workflow.md for valid attributes.
  voice_file: ""
  voice_instruct: "男，中年，中音调，语速快"
  # voice_ref_eq_db: high-frequency clarity boost (dB) for the auto-generated
  #   reference voice — the qwen3 voice-design output is band-limited above
  #   ~2 kHz (muffled, fricatives inaudible); 8-16 works well, 0 = disable.
  # 参考音色还会归一化响度到 tts.loudness_target。
  voice_ref_eq_db: 12
  # voice_ref_content: optional override for the reference spoken text (default
  #   is a fricative-rich balanced sentence).
  voice_ref_content: ""
    # ── HTTP TTS server config (only used when backend: http_server) ───────
    # Protocol: POST multipart/form-data
    #   Fields:  input      — narration text (form field)
    #            speed      — speech speed multiplier (form field, float as string)
    #            voice_file — reference WAV (file upload, audio/wav)
    #   Response: raw audio bytes (HTTP 200 → body is the WAV data)
    #
    # The URL is resolved via os.path.expandvars(). ${BACKEND_PROXY_ENDPOINT}
    # must be set in the shell environment before running any TTS command.
  http:
      url: ${BACKEND_PROXY_ENDPOINT}/v1/audio/speech
      speed: 1.0              # 0.25–4.0, passed as form field
      headers:                # custom HTTP headers (optional)
        Host-User-ID: ""
        Host-User-Token: ""
bgm:
  # Background music — generated once per project via comfyui-scheduler
  # stable_audio_3_medium (text-to-music), then mixed in-render by Remotion <Audio>.
  enabled: true # set false to skip BGM entirely
  # audio: written back by run_bgm.py (Step 11) after generation. May also point
  #   at your own music file to skip generation.
  audio: /path/to/projects/my-project/bgm.mp3
  # prompt: agent fills with a music description (style, instruments, mood) before
  #   Step 11. Example shown here.
  prompt: "舒缓的纪录片背景音乐，钢琴与弦乐，节奏平缓，情绪温和克制，无人声。"
  loop: true # loop the BGM to fill the whole video
  length: 120 # target BGM length in seconds
  volume: 0.10 # BGM volume 0–0.3
theme:
  # These override the matching fields in themes/<category>.yaml.
  # Explicit fields here win; everything else falls back to the theme preset.
  primary_color: "#4f6ef7"
  background_color: "#ffffff"
  text_color: "#1a1a1a"
  accent_color: "#FF6B6B"
  transition_type: fade   # fade | slide | wipe | none
  transition_duration: 12 # frames @ fps
  # show_progress_bar: 是否展示底部章节进度条。true（默认）= 展示；false = 隐藏。
  show_progress_bar: true
ad_video:
  # Step 14 在章节边界插入广告短片。视频来源：{project_root}/ad_video 目录 + ad_video.directories。
  enabled: true # 是否开启广告插入。true（默认）= 开启；false = 关闭。
  insert_position: middle # beginning（开头）| middle（中间，默认，agent 决策具体章节边界）| end（结尾）
  directories: [] # 自定义广告目录（相对 project 根目录或绝对路径），支持多个。默认空 = 只扫描项目下 ad_video 目录。
  # insert_after_story: story3 # insert_position=middle 时由 agent 在 Step 14 填写具体章节边界（插在该章之后）。
content:
  duration: medium # 仅控制章节数：short=2-3 章 / medium=5-7 章 / long=8-12 章
  min_story_chars: 300 # 每章基准字数：全部章节讲稿（stories/{story_id}/script.md）总字数须 ≥ min_story_chars×章节数（无单章下限），verify_story_scripts.py 校验
render:
  mode: local # 渲染方式: local(容器内本地渲染) | distributed(集群分布式渲染,按渲染时长计费)
  codec: h264 # 视频编码：h264 | h265 | vp8 | vp9 | av1 | prores
  crf: 23 # 画质/体积权衡 0-51（越小画质越高、文件越大）
  timeout_ms: 60000 # 单帧组件/delayRender 超时（Remotion 默认 30000；大体积 AIGC 资产加载慢时可调大）
  # 分段渲染：并发自适应——单 Chrome 内取帧并发上限 8；当 CPU 目标（≈有效核数/2）
  # 超过上限时，多余核数溢出到更多分段 worker（受内存约束）。≤16 核机器实际为单进程。
  # 如需覆盖：
  # segment_frames: 600   # 每个渲染分段的帧数
  # segment_workers: auto # 并发分段数（默认自动）
dependence_paths:
  # Pre-filled by init_project.py to the workspace's dep/ directory as
  # workspace-relative paths (resolved against the workspace at runtime).
  # Repos:
  #   https://github.com/calcuforge/remotion-video-template.git
  #   https://github.com/calcuforge/comfyui-scheduler.git
  remotion_template: dep/remotion-video-template
  comfyui_scheduler: dep/comfyui-scheduler
subtitle:
  # font_size: adjust based on resolution and orientation. Do NOT go too small.
  #   1080p horizontal → 26-32    1080p vertical → 36-44
  #   4K horizontal   → 47-57    4K vertical   → 62-73
  font_size: 32
  primary_color: "&H00333333"
  outline_color: "&H00FFFFFF"
  outline: 2
  alignment: 2
  marginV: 6
rss_source_list:
  - url: xxx
    description: xxx