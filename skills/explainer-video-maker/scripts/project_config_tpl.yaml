# project_config.yaml template — default values for a new project.
# init_project.py copies this file into projects/{name}/project_config.yaml and
# fills project.project_root_path. The agent then edits the created file DIRECTLY
# to supply request-dependent fields (marked "agent fills" below).
project:
  name: my-project # agent fills: categorized project name = content_structure_params (e.g. air_crash_documentary_1080p_horizontal) — NOT the specific video title
  project_root_path: "" # filled by init_project.py — absolute path to the project dir
  creation_mode: auto # auto — pipeline runs end-to-end. manual — each AI product waits for user confirmation.
  language: "" # agent fills: narration language zh-CN | en-US
  video_style: "" # agent fills: e.g. documentary, knowledge_sharing, news_broadcast, product_intro, data_report, tutorial
  target_audience: "" # agent fills: e.g. general, tech_enthusiasts, students, professionals, investors
video:
  orientation: horizontal # horizontal (16:9) | vertical (9:16).
  resolution: 1080p # 1080p (1920x1080 / 1080x1920) | 4k (3840x2160 / 2160x3840).
  fps: 24
aigc:
  # Origin (pre-upscale) generation dimensions. AIGC assets are generated at
  # these sizes, then upscaled to the target video resolution if needed.
  origin_image_width: 1920
  origin_image_height: 1080
  origin_video_width: 960
  origin_video_height: 540
  seed: 0 # global random seed
stock_media:
  # Stock media search for scenes with asset_generation_method: stock.
  # search_image: enable stock search for image scenes (type: image). Default true.
  # search_video: enable stock search for video scenes (type: video). Default false
  #   (stock video is often low quality / short; prefer AIGC for video unless
  #   the scene is purely atmospheric B-roll).
  # The agent MUST check these flags in Step 6 when deciding asset_generation_method.
  search_image: false
  search_video: false
  # Each entry specifies a provider and its API key (configured directly here).
  # Default: empty list — stock media search is disabled even if search_image/video are true.
  # Example:
  #   sources:
  #     - provider: pexels
  #       api_key: "your-pexels-api-key"
  #     - provider: pixabay
  #       api_key: "your-pixabay-api-key"
  #     - provider: unsplash    # photos only
  #       api_key: "your-unsplash-access-key"
  sources: []
tts:
  # backend: comfyui_indextts — ComfyUI index_tts_2 workflow (default).
  #          http_server      — HTTP multipart TTS server (see tts.http below).
  backend: comfyui_indextts
  # speed: narration speech-rate multiplier. Each synthesized narration is
  #   time-stretched so ALL narrations share the same pace: speed × base rate,
  #   1.0 = 5 CJK chars/s (zh) or ~2.5 words/s (en, ≈150 wpm). The voice-design
  #   reference audio is NOT adjusted.
  speed: 1.0
  # volume: narration audio volume 0–1 (multiplier applied by Remotion <Audio>).
  #   Remotion caps volume at 1.0 — to make the narration louder, use `loudnorm`
  #   below (normalizes the audio file) instead of raising this above 1.
  volume: 1.0
  # pause_seconds: silence added AFTER each narration's audio (before the next
  #   narration) so the pacing breathes. Added to narration.total_frame during TTS.
  pause_seconds: 0.5
  # loudnorm: normalize each narration's audio to a target loudness (LUFS) so the
  #   narration is consistently audible. Re-encodes the narration WAV after TTS
  #   (downsampling it to 24 kHz — cuts the backend's 192 kHz broadband hiss
  #   before it reaches the 48 kHz mix).
  loudnorm: true
  # loudness_target: integrated loudness target in LUFS (negative). Higher (less
  #   negative) = louder. e.g. -16 broadcast/narration, -14 streaming (default),
  #   -12 noticeably louder. Adjust here to tune the narration loudness.
  loudness_target: -14
  # voice_file: empty at Step 1. If empty when running TTS (Step 7), the voice
  #   design workflow runs automatically using voice_instruct and updates this field.
  voice_file: ""
  # voice_instruct: REQUIRED — empty at init. The agent MUST fill it in before
  #   Step 7 (run_tts.py). When voice_file is empty, the voice design workflow
  #   (qwen3_tts_voice_design) runs automatically using voice_instruct and errors
  #   if it is still empty. Examples (include a fast pace — narrations are
  #   time-stretched to the uniform speech-rate standard, and a natively fast
  #   reference voice keeps those adjustments small):
  #   zh-CN: "男，中年，中音调，语速快"   en-US: "male, middle-aged, moderate pitch, fast pace"
  #   See comfyui-scheduler/doc/workflow.md for the valid voice attributes.
  voice_instruct: ""
  # voice_ref_eq_db: high-frequency clarity boost (dB) applied to the
  #   AUTO-GENERATED reference voice (voice_file empty). The qwen3 voice-design
  #   output is band-limited (energy above 2 kHz sits ~20 dB below the low band —
  #   "muffled, s/f/l fricatives inaudible"), so the shelf lift restores the
  #   fricative band the clone model extracts. 6 works well; 0 = disable.
  voice_ref_eq_db: 6
  # voice_ref_content: optional override for the reference audio's spoken text.
  #   Default is a fricative-rich phonetically balanced sentence (covers
  #   s/sh/f/l/j/q/x/z/c). Longer/denser content = clearer articulation features.
  voice_ref_content: ""
  # HTTP TTS server config (only used when backend: http_server).
  # Protocol: POST multipart/form-data (fields: input, speed, voice_file).
  # The URL is resolved via os.path.expandvars(); ${BACKEND_PROXY_ENDPOINT}
  # must be set in the shell environment before running any TTS command.
  http:
    url: ${BACKEND_PROXY_ENDPOINT}/v1/audio/speech
    speed: 1.0 # 0.25–4.0, passed as form field
bgm:
  # Background music — generated once per project via comfyui-scheduler
  # stable_audio_3_medium (text-to-music), then mixed in-render by Remotion <Audio>.
  enabled: true # master on/off. Set false to skip BGM entirely.
  # audio: empty at init. run_bgm.py (Step 11) generates projects/{name}/bgm.mp3 and
  #   writes this field back with the absolute path. You may also point it directly
  #   at your own music file to skip generation.
  audio: ""
  # prompt: REQUIRED — empty at init. The agent MUST fill in a music description
  #   (style, instruments, mood) before Step 11 (run_bgm.py); the script errors if
  #   it is still empty. Examples:
  #   zh-CN: "舒缓的纪录片背景音乐，钢琴与弦乐，节奏平缓，情绪温和克制，无人声。"
  #   en-US: "Calm documentary background music, piano and strings, gentle rhythm, no vocals."
  prompt: ""
  loop: true # loop the BGM to fill the whole video
  length: 120 # target BGM length in seconds (text-to-music duration)
  volume: 0.30 # BGM volume 0–0.3 (Remotion <Audio> volume)
theme:
  # These override the matching fields in themes/<category>.yaml.
  # Explicit fields here win; everything else falls back to the theme preset.
  primary_color: "#4f6ef7"
  background_color: "#ffffff"
  text_color: "#1a1a1a"
  accent_color: "#FF6B6B"
  transition_type: fade # fade | slide | wipe | none
  transition_duration: 12 # frames @ fps
  # show_progress_bar: whether to render the bottom chapter progress bar.
  #   true (default) = show; false = hide.
  show_progress_bar: true
ad_video:
  # Insert ad short videos at a chapter boundary of the finished video (Step 14).
  # Videos are detected under {project_root}/ad_video plus any ad_video.directories.
  enabled: true # whether ad insertion is on. true (default) = on; false = off.
  insert_position: middle # beginning | middle (default) | end. middle = the agent
    # decides the exact chapter boundary and writes it to insert_after_story below.
  directories: [] # extra ad directories (relative to project root or absolute),
    # multiple allowed. Default empty = scan only {project_root}/ad_video.
  # insert_after_story: story3 # agent decision for insert_position=middle:
    # the ad(s) are inserted right AFTER this chapter. Filled by the agent at Step 14.
content:
content:
  # duration: controls the number of chapters (stories) only —
  #   short = 2-3 chapters, medium = 5-7 chapters, long = 8-12 chapters.
  duration: medium
  # min_story_chars: base character count PER chapter. There is no per-chapter
  #   minimum; the COMBINED length of all chapter scripts (stories/{story_id}/script.md)
  #   must reach min_story_chars × <number of chapters>. Enforced by
  #   verify_story_scripts.py (Step 5).
  min_story_chars: 300
render:
  mode: local # 渲染方式: local(容器内本地渲染) | distributed(集群分布式渲染,按渲染时长计费)
  codec: h264 # video codec: h264 | h265 | vp8 | vp9 | av1 | prores
  crf: 23 # quality/size tradeoff 0-51 (lower = higher quality, larger file)
  timeout_ms: 120000 # per-frame component/delayRender timeout (Remotion default 30000; raise if large AIGC assets load slowly)
  # Rendering is segmented + adaptive: per-render concurrency (frames in one
  # Chrome) is capped at 8; when the CPU target (≈ half effective cores) exceeds
  # it, surplus cores spill into more segment workers (memory-bounded). On ≤16
  # core machines this is effectively single-process. Uncomment to override:
  # segment_frames: 600   # frames per render segment
  # segment_workers: auto # concurrent segment renders (default auto)
dependence_paths:
  # Filled by init_project.py with workspace-relative paths into the workspace's
  # dep/ directory (e.g. dep/remotion-video-template). A relative path resolves
  # against the workspace (the directory that contains projects/); a ~-path or
  # absolute path is used as-is. Override only if the dependencies live elsewhere.
  # Repos: https://github.com/calcuforge/remotion-video-template.git
  #        https://github.com/calcuforge/comfyui-scheduler.git
  remotion_template: ""
  comfyui_scheduler: ""
subtitle:
  # font_size: adjust based on resolution and orientation. Do NOT go too small.
  #   1080p horizontal → 26-32    1080p vertical → 36-44
  #   4K horizontal   → 47-57    4K vertical   → 62-73
  font_size: 32
  primary_color: "&H00333333"
  outline_color: "&H00FFFFFF"
  outline: 2
  alignment: 2
  marginV: 6
rss_source_list: [] # Step 3: cached RSS feeds ({url, description})
# 推广信息（长文本，可选）：本项目视频发布到各视频平台时附带的内容
# （如账号关注引导、合作/联系方式、系列推荐等）。由 video-publisher skill
# 在发布时读取：有视频简介表单的平台填入简介，无简介表单的平台由 agent
# 按平台类型决定填写位置（如评论区）。空字符串 = 不附加推广。
promotion: ""
